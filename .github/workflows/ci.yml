name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec ray build -e dist -o dist -I
      # `ray lint` wants npm's package-lock.json under CI; these are the checks it runs.
      - run: pnpm exec eslint .
      - run: pnpm exec prettier --check .
      - run: pnpm typecheck
      - run: pnpm test
